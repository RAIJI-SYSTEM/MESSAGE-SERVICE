# =============================================================================
# CI do MESSAGE-SERVICE — tudo em jobs paralelos (fail-fast: false):
#   1. coverage  -> Vitest + cobertura V8
#   2. mutation  -> StrykerJS
#   3. e2e       -> Playwright contra a stack completa (Kong/Keycloak/chat)
#   4. load      -> Locust: smoke, stress, mensageria AMQP e 1xN
#
# Os jobs de E2E e carga sobem a stack a partir do repositório do monólito.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  # push e pull_request da mesma branch compartilham o grupo: um cancela o outro.
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cobertura (Vitest + V8)
  # ---------------------------------------------------------------------------
  coverage:
    name: Cobertura (Vitest/V8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (lockfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Vitest + cobertura
        run: |
          mkdir -p reports/testes
          ./node_modules/.bin/vitest run --coverage --reporter=json --outputFile=reports/testes/vitest.json

      - name: Gerar relatório HTML consolidado
        run: python3 scripts/reporting/generate_vitest_report.py reports/testes

      - name: Upload cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-coverage
          path: |
            coverage/
            reports/testes/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Mutação (StrykerJS)
  # ---------------------------------------------------------------------------
  mutation:
    name: Mutação (StrykerJS)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (lockfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Stryker
        run: npm run mutation

      - name: Upload relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-mutation
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — stack completa
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright · stack completa)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: avxae-core-monolith
      KONG_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clonar monólito (stack)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/RAIJI-SYSTEM/AVXAE-CORE-MONOLITH.git "$RUNNER_TEMP/avxae-core-monolith" \
            || git clone --depth 1 \
            https://github.com/RAIJI-SYSTEM/AVXAE-CORE-MONOLITH.git "$RUNNER_TEMP/avxae-core-monolith"

      - name: Subir stack completa (chat usa este repositório)
        env:
          CHAT_CONTEXT: ${{ github.workspace }}
        run: >
          docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith"
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml"
          --profile chat up -d --build

      - name: Aguardar monólito e chat
        run: |
          set -uo pipefail
          ok=0
          for _ in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/actuator/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Monólito não respondeu em http://localhost:8000/actuator/health"
            docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
              -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat ps
            exit 1
          fi
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' raiji-chat 2>/dev/null || true)" = "healthy" ] && break
            sleep 5
          done
          status=$(docker inspect -f '{{.State.Health.Status}}' raiji-chat 2>/dev/null || true)
          echo "chat: ${status:-desconhecido}"
          [ "$status" = "healthy" ]

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Executar E2E
        working-directory: e2e
        run: npx playwright test --reporter=list,html

      - name: Validar auditoria no Mongo
        run: |
          sleep 2
          total=$(docker exec raiji-chat-mongo mongosh raiji --quiet --eval 'db.audit_events.countDocuments()')
          echo "audit_events=$total"
          [ "$total" -gt 0 ]

      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat logs --tail=250

      - name: Upload relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-e2e
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Derrubar stack
        if: always()
        run: docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Carga (Locust) — smoke, stress, mensageria AMQP e escalabilidade 1xN
  # ---------------------------------------------------------------------------
  load:
    name: Carga (Locust · stress · mensageria · 1xN)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: avxae-core-monolith
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clonar monólito (stack)
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/RAIJI-SYSTEM/AVXAE-CORE-MONOLITH.git "$RUNNER_TEMP/avxae-core-monolith" \
            || git clone --depth 1 \
            https://github.com/RAIJI-SYSTEM/AVXAE-CORE-MONOLITH.git "$RUNNER_TEMP/avxae-core-monolith"

      - name: Subir stack do chat (sem o app Java)
        env:
          CHAT_CONTEXT: ${{ github.workspace }}
        run: >
          docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith"
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml"
          --profile chat up -d --build
          postgres keycloak rabbitmq mongo rustfs rustfs-init kong-init kong chat

      - name: Aguardar chat
        run: |
          set -uo pipefail
          for _ in $(seq 1 120); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' raiji-chat 2>/dev/null || true)" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
            -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat logs --tail=250
          exit 1

      - name: Setup Python (Locust)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Locust
        working-directory: load-tests
        run: ./run.sh deps

      - name: Carga — smoke
        working-directory: load-tests
        env:
          LOAD_USERS: "10"
          LOAD_SPAWN: "5"
          SMOKE_HOLD: "15"
          ANNOTATE: "0"
        run: ./run.sh smoke

      - name: Carga — stress (degraus reduzidos)
        working-directory: load-tests
        env:
          LOAD_USERS: "15"
          LOAD_START: "5"
          LOAD_STEP: "5"
          LOAD_STEP_TIME: "2"
          LOAD_SPAWN: "5"
          ANNOTATE: "0"
        run: ./run.sh stress

      - name: Mensageria — carga AMQP
        working-directory: load-tests
        env:
          AMQP_USERS: "2"
          AMQP_SPAWN: "1"
          AMQP_HOLD: "5"
        run: |
          AMQP_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' raiji-rabbitmq)
          RAIJI_AMQP_URL="amqp://raiji:raiji123@${AMQP_IP}:5672/%2f" ./run-messaging.sh smoke

      - name: Mensageria — DLQ + reprocessamento
        run: |
          load-tests/.venv/bin/pip install --quiet requests
          load-tests/.venv/bin/python scripts/evidence/messaging_dlq.py message-service

      - name: Escalabilidade 1xN (N=1 e N=2)
        working-directory: load-tests
        env:
          NETWORK: avxae-core-monolith_default
          MONGO_URI: mongodb://mongo:27017/raiji
          RABBIT_URI: amqp://raiji:raiji123@rabbitmq:5672
          KEYCLOAK_ISSUER: http://keycloak:8080/realms/raiji
          KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/raiji/protocol/openid-connect/certs
          N_LIST: "1 2"
          USERS: "5"
          HOLD: "5"
          ANNOTATE: "0"
        run: ./run-scale.sh

      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat logs --tail=250

      - name: Upload relatórios Locust
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-locust
          path: |
            load-tests/reports/
            load-tests/scale-results.json
            reports/drills/
          if-no-files-found: ignore
          retention-days: 14

      - name: Derrubar stack
        if: always()
        run: docker compose --project-directory "$RUNNER_TEMP/avxae-core-monolith" \
          -f "$RUNNER_TEMP/avxae-core-monolith/docker-compose.yml" --profile chat down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # Regressão — quebra proposital em worktree temporária + métricas formais.
  # ---------------------------------------------------------------------------
  regression:
    name: Regressão (quebra proposital)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (lockfile)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Quebra controlada + suíte de regressão
        run: python3 scripts/evidence/regression_drill.py message-service

      - name: Upload evidência da regressão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: message-regression
          path: reports/drills/
          if-no-files-found: ignore
          retention-days: 14
